[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-conformance"
version = "0.1.0"
description = "Live conformance probe for OpenEnv environment servers: HTTP reset/step/state contract plus /ws session behaviour"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shriram K Vasudevan" }]
keywords = ["openenv", "reinforcement-learning", "rl-environments", "aaif", "conformance", "testing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shriramkv/openenv-conformance"

[project.scripts]
openenv-conformance = "openenv_conformance.cli:main"

[tool.setuptools]
packages = ["openenv_conformance", "openenv_conformance.samples"]
